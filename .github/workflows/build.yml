name: Build XashOrbis PS4

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies & Setup Open PS4 SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libsdl2-dev libgl1-mesa-dev libfontconfig1-dev clang lld git python3
        
        git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/openps4sdk
        
        echo "OO_PS4_TOOLCHAIN=$HOME/openps4sdk" >> $GITHUB_ENV
        echo "$HOME/openps4sdk/bin" >> $GITHUB_PATH
        echo "$HOME/openps4sdk/bin/linux" >> $GITHUB_PATH

    - name: Fix rsqrt conflict in source code
      run: |
        find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.cc" \) -exec sed -i 's/\brsqrt\b/xash_rsqrt/g' {} +

    - name: Configure CMake for PS4
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DXASH_64BIT=1 \
          -DCMAKE_C_STANDARD=11 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_FLAGS="-w -D_GNU_SOURCE -Wno-error=incompatible-pointer-types -Wno-error=int-conversion" \
          -DCMAKE_CXX_FLAGS="-w -D_GNU_SOURCE -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"

    - name: Compile Project
      run: cmake --build build --parallel $(nproc)

    - name: Find and Extract Binary
      run: |
        mkdir -p ps4_output
        echo "=== СМОТРИМ ЧТО СОБРАЛОСЬ В BUILD ==="
        find build -type f
        
        # Ищем любой файл .elf, .velf или исполняемый файл без расширения и копируем как eboot.bin
        find build -name "*.elf" -o -name "*.velf" -o -type f -executable | head -n 1 | xargs -I {} cp {} ps4_output/eboot.bin
        
        # Если вдруг не нашли через поиск, берем самый большой файл из папки build
        if [ ! -f "ps4_output/eboot.bin" ]; then
          find build -type f -size +100k | head -n 1 | xargs -I {} cp {} ps4_output/eboot.bin || true
        fi
        
        ls -la ps4_output

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XashOrbis-PS4-Binary
        path: ps4_output/
        
