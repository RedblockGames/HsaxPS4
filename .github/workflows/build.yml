name: Build Xash3D Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libsdl2-dev libgl1-mesa-dev libfontconfig1-dev

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DXASH_64BIT=1 -DCMAKE_C_STANDARD=11 -DCMAKE_C_FLAGS="-fpermissive -Wno-error" -DCMAKE_CXX_FLAGS="-fpermissive -Wno-error"

    - name: Compile Project
      run: cmake --build build
      
