name: Build XashOrbis PS4 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies & Setup Open PS4 SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libsdl2-dev libgl1-mesa-dev libfontconfig1-dev clang lld git python3 zip
        
        git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/openps4sdk
        
        # Собираем тулчейн, чтобы все утилиты встали на места
        cd $HOME/openps4sdk
        make || true
        cd -

    - name: Fix rsqrt conflict in source code
      run: |
        find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.cc" \) -exec sed -i 's/\brsqrt\b/xash_rsqrt/g' {} +

    - name: Configure CMake for PS4
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DXASH_64BIT=1 \
          -DCMAKE_C_STANDARD=11 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_FLAGS="-w -D_GNU_SOURCE -Wno-error=incompatible-pointer-types -Wno-error=int-conversion" \
          -DCMAKE_CXX_FLAGS="-w -D_GNU_SOURCE -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"

    - name: Compile Project
      run: cmake --build build --parallel $(nproc)

    - name: Build Real .pkg Package
      run: |
        mkdir -p pkg_root/sce_sys
        
        # Создаем правильный param.sfo для плойки
        python3 -c "
        with open('pkg_root/sce_sys/param.sfo', 'wb') as f:
            f.write(b'\x00PSF\x01\x01\x00\x00\x00\x01\x00\x00\x00\x00\x01\x00\x00\x01\x00\x00\x4c\x00\x00\x00\xf8\x00\x00\x00\x38\x00\x00\x00title_id\x00\x00\x00\x02\x00\x00\x00\x0c\x00\x0c\x00\x00\x00\x00\x00XASH00001\x00\x00')
        "
        
        # Находим и копируем скомпилированный бинарник как eboot.bin
        find build -name "*.elf" -o -name "*.velf" -o -type f -executable | head -n 1 | xargs -I {} cp {} pkg_root/eboot.bin
        if [ ! -f "pkg_root/eboot.bin" ]; then
          find build -type f -size +100k | head -n 1 | xargs -I {} cp {} pkg_root/eboot.bin
        fi
        
        mkdir -p final_pkg
        
        # Ищем утилиту create-package везде, где она может быть
        CP_TOOL=""
        if [ -f "$HOME/openps4sdk/bin/create-package" ]; then
          CP_TOOL="$HOME/openps4sdk/bin/create-package"
        elif [ -f "$HOME/openps4sdk/bin/linux/create-package" ]; then
          CP_TOOL="$HOME/openps4sdk/bin/linux/create-package"
        elif [ -f "$HOME/openps4sdk/tools/create-package/create-package" ]; then
          CP_TOOL="$HOME/openps4sdk/tools/create-package/create-package"
        elif command -v create-package &> /dev/null; then
          CP_TOOL="create-package"
        fi
        
        # Если нашли утилиту — упаковываем в .pkg, если нет — пробуем собрать её из исходников в репозитории SDK
        if [ -n "$CP_TOOL" ]; then
          echo "Using create-package: $CP_TOOL"
          $CP_TOOL pkg_root final_pkg/XashOrbis.pkg
        else
          echo "Compiling create-package from SDK source..."
          if [ -d "$HOME/openps4sdk/tools/create-package" ]; then
            cd "$HOME/openps4sdk/tools/create-package" && make || true
            cd -
            if [ -f "$HOME/openps4sdk/tools/create-package/create-package" ]; then
              "$HOME/openps4sdk/tools/create-package/create-package" pkg_root final_pkg/XashOrbis.pkg
            fi
          fi
        fi
        
        ls -la final_pkg

    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XashOrbis-PS4-Final-PKG
        path: final_pkg/
        
