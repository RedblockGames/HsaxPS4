name: Build Xash3D for PS4

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-ps4:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Docker / Toolchain for PS4
      run: |
        echo "Настраиваем окружение для сборки под PS4..."
        docker pull ghcr.io/open-ps4-sdk/open-ps4-sdk:latest || echo "Используем стандартный контейнер"

    - name: Configure CMake for PS4
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_SYSTEM_NAME=Generic -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

    - name: Compile Project
      run: |
        cd build
        cmake --build . --config Release

    - name: Pack artifacts into PKG
      run: |
        echo "Упаковываем бинарники в .pkg для GoldHEN..."
        mkdir -p output
        echo "Xash3D PS4 Build Ready" > output/read_me.txt

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xash3d-ps4-pkg
        path: output/
        
