name: Build Xash3D PS4 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies & Download Open PS4 SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libsdl2-dev libgl1-mesa-dev libfontconfig1-dev clang lld curl
        
        mkdir -p $HOME/openps4sdk
        curl -L https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/v0.5.3.tar.gz -o $HOME/openps4sdk/sdk.tar.gz
        tar -xzf $HOME/openps4sdk/sdk.tar.gz -C $HOME/openps4sdk
        
        echo "OO_PS4_TOOLCHAIN=$HOME/openps4sdk" >> $GITHUB_ENV
        echo "$HOME/openps4sdk/bin/linux" >> $GITHUB_PATH

    - name: Fix rsqrt conflict in source code
      run: |
        find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.cc" \) -exec sed -i 's/\brsqrt\b/xash_rsqrt/g' {} +

    - name: Configure CMake for PS4
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DXASH_64BIT=1 \
          -DCMAKE_C_STANDARD=11 \
          -DCMAKE_C_COMPILER=orbis-clang \
          -DCMAKE_CXX_COMPILER=orbis-clang++ \
          -DCMAKE_C_FLAGS="-w -D_GNU_SOURCE -Wno-error=incompatible-pointer-types -Wno-error=int-conversion" \
          -DCMAKE_CXX_FLAGS="-w -D_GNU_SOURCE -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"

    - name: Compile Project
      run: cmake --build build --parallel $(nproc)

    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Xash3D-PS4
        path: |
          build/**/*.pkg
          build/**/*.elf
          
