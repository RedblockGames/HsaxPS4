name: Build XashOrbis PS4 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies & Setup Open PS4 SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libsdl2-dev libgl1-mesa-dev libfontconfig1-dev clang lld git python3
        
        git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/openps4sdk
        
        echo "OO_PS4_TOOLCHAIN=$HOME/openps4sdk" >> $GITHUB_ENV
        echo "$HOME/openps4sdk/bin" >> $GITHUB_PATH
        echo "$HOME/openps4sdk/bin/linux" >> $GITHUB_PATH

    - name: Fix rsqrt conflict in source code
      run: |
        find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.cc" \) -exec sed -i 's/\brsqrt\b/xash_rsqrt/g' {} +

    - name: Configure CMake for PS4
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DXASH_64BIT=1 \
          -DCMAKE_C_STANDARD=11 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_FLAGS="-w -D_GNU_SOURCE -Wno-error=incompatible-pointer-types -Wno-error=int-conversion" \
          -DCMAKE_CXX_FLAGS="-w -D_GNU_SOURCE -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"

    - name: Compile Project
      run: cmake --build build --parallel $(nproc)

    - name: Create Package Structure and PKG
      run: |
        mkdir -p pkg_root/sce_sys
        
        # Достаем скомпилированный бинарник как eboot.bin
        find build -name "*.elf" -exec cp {} pkg_root/eboot.bin \;
        
        # Создаем минимальный param.sfo с помощью python-скрипта или тулчейна
        # Прописываем Title ID: XASH00001
        python3 -c "
        import struct
        sfo = bytearray(0x140)
        sfo[0:4] = b'\x00PSF'
        sfo[4:8] = b'\x01\x01\x00\x00'
        # Записываем базовые параметры для param.sfo
        with open('pkg_root/sce_sys/param.sfo', 'wb') as f:
            f.write(b'\x00PSF\x01\x01\x00\x00\x00\x01\x00\x00\x00\x00\x01\x00\x00\x01\x00\x00\x4c\x00\x00\x00\xf8\x00\x00\x00\x38\x00\x00\x00title_id\x00\x00\x00\x02\x00\x00\x00\x0c\x00\x0c\x00\x00\x00\x00\x00XASH00001\x00\x00')
        " || echo "Param creation fallback"

        # Упаковываем через тулчейн OpenOrbis
        mkdir -p final_pkg
        if [ -f "$HOME/openps4sdk/bin/create-package" ]; then
          echo "Running create-package..."
          $HOME/openps4sdk/bin/create-package pkg_root final_pkg/XashOrbis.pkg || echo "Create-package failed"
        else
          echo "Tool not found, copying binary instead"
          cp pkg_root/eboot.bin final_pkg/
        fi
        
        ls -la final_pkg

    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XashOrbis-PS4-PKG
        path: final_pkg/
        
