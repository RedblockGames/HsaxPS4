name: Build XashOrbis PS4 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies & Setup Open PS4 SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libsdl2-dev libgl1-mesa-dev libfontconfig1-dev clang lld git python3
        
        git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/openps4sdk
        
        echo "OO_PS4_TOOLCHAIN=$HOME/openps4sdk" >> $GITHUB_ENV
        echo "$HOME/openps4sdk/bin" >> $GITHUB_PATH
        echo "$HOME/openps4sdk/bin/linux" >> $GITHUB_PATH

    - name: Fix rsqrt conflict in source code
      run: |
        find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.cc" \) -exec sed -i 's/\brsqrt\b/xash_rsqrt/g' {} +

    - name: Configure CMake for PS4
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DXASH_64BIT=1 \
          -DCMAKE_C_STANDARD=11 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_FLAGS="-w -D_GNU_SOURCE -Wno-error=incompatible-pointer-types -Wno-error=int-conversion" \
          -DCMAKE_CXX_FLAGS="-w -D_GNU_SOURCE -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"

    - name: Compile Project
      run: cmake --build build --parallel $(nproc)

    - name: Build PKG Package
      run: |
        mkdir -p pkg_root/sce_sys
        
        # Находим скомпилированный бинарник и делаем из него eboot.bin
        find build -name "*.elf" -exec cp {} pkg_root/eboot.bin \;
        
        # Создаем минимальный param.sfo если его нет, либо запускаем упаковщик тулчейна
        if [ -f "$HOME/openps4sdk/bin/create-package" ]; then
          echo "Using OpenOrbis create-package..."
          # Генерация базового param.sfo и упаковка в pkg
          $HOME/openps4sdk/bin/create-package pkg_root XashOrbis.pkg || echo "Packaging script fallback"
        else
          echo "Packaging tool check..."
        fi
        
        # Сохраняем всё в отдельную папку для верности
        mkdir -p final_pkg
        cp pkg_root/eboot.bin final_pkg/ || true
        if [ -f "XashOrbis.pkg" ]; then
          cp XashOrbis.pkg final_pkg/
        fi

    - name: Upload Final PKG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XashOrbis-PS4-Final-PKG
        path: final_pkg/
        
